{% extends "home.html" %}
{% block title %}Upload Data{% endblock %}

{% block content %}
<h2>Upload & Download Data Files</h2>

<!-- ================= UPLOAD FORM ================= -->
<form method="post" action="/upload" enctype="multipart/form-data">
  <input type="hidden" name="action" value="upload">

  <label>Choose file to upload</label><br>
  <input type="file" name="file" required><br><br>

  <label>Replace existing file:</label><br>
  <select name="target" required>
    <option value="">-- Select --</option>
    <option value="cadets_blues">Cadet Data – Blues</option>
    <option value="cadets_ocp">Cadet Data – OCP</option>
    <option value="cadets_ptg">Cadet Data – PTG</option>
    <option value="inventory">Supply Inventory</option>
  </select><br><br>

  <button type="submit" class="btn btn-danger">Upload & Overwrite</button>
</form>

<hr>

<!-- ================= DOWNLOAD FORM ================= -->
<form method="post" action="/upload">
  <input type="hidden" name="action" value="download">

  <label>Choose file to download</label><br>
  <select name="target" required>
    <option value="">-- Select --</option>
    <option value="cadets_blues">Cadet Data – Blues</option>
    <option value="cadets_ocp">Cadet Data – OCP</option>
    <option value="cadets_ptg">Cadet Data – PTG</option>
    <option value="inventory">Supply Inventory</option>
  </select><br><br>

  <button type="submit" class="btn btn-primary">Download</button>
</form>
{% endblock %}
